name: Source companion verification

on:
  pull_request:
  push:
    branches: [main, "prepare/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned engine source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tpmoonchefryan/einzbern
          ref: 41a3c974d77ac7dbe84b4852b08ebc705017fede
          path: .engine-source
          persist-credentials: false
      - name: Install pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - name: Acquire pinned build dependencies
        env:
          npm_config_offline: "false"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_update_notifier: "false"
        run: |
          npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund --no-update-notifier
          test "$(pnpm --version)" = "11.3.0"
          pnpm --dir .engine-source install --frozen-lockfile --ignore-scripts --config.offline=false
      - name: Verify engine pin and build renderer
        run: |
          test "$(git -C .engine-source rev-parse HEAD)" = "41a3c974d77ac7dbe84b4852b08ebc705017fede"
          pnpm --dir .engine-source build
      - name: Run complete helper contracts and syntax checks
        run: |
          node --test tests/*.test.mjs
          find scripts tests skill -name '*.mjs' -type f -print0 | xargs -0 -n 1 node --check
      - name: Compare every generated byte to pinned renderer
        run: |
          mkdir -p artifacts
          node scripts/verify-source-preparation.mjs .engine-source > artifacts/source-readback.json
      - name: Retain source-only verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-readback-${{ github.sha }}
          path: artifacts/source-readback.json
          if-no-files-found: error
